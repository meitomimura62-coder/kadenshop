services:
  api:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: app
      DB_USER: app
      DB_PASS: apppass
    depends_on:
      - db
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src

  web:
    build: ./web
    ports:
      - "8082:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: app
      DB_USER: app
      DB_PASS: apppass
    depends_on:
      - db
    volumes:
      - ./web:/app

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
      TZ: Asia/Tokyo
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: app
      PMA_PASSWORD: apppass
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data: